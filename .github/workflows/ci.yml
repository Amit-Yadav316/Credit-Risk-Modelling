name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check src api app tests scripts
      - run: pytest -q

  smoke-train:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Train on a reduced trial budget against a local sqlite store
        run: |
          python scripts/make_synthetic_data.py
          sed -i 's/n_trials: 40/n_trials: 2/' configs/config.yaml
          sed -i 's/tune_sample_size: 60000/tune_sample_size: null/' configs/config.yaml
          sed -i 's/cv_folds: 5/cv_folds: 3/' configs/config.yaml
          sed -i 's|tracking_uri: sqlite:///mlflow.db|tracking_uri: sqlite:///ci.db|' configs/config.yaml
          python -m credit_risk.pipelines.train_pipeline
      - name: Confirm the champion alias loads and scores
        run: |
          sed -i 's|tracking_uri: sqlite:///mlflow.db|tracking_uri: sqlite:///ci.db|' configs/config.yaml
          python - <<'PY'
          import pandas as pd
          from credit_risk.config import AppConfig
          from credit_risk.scoring.service import ScoringService
          svc = ScoringService(AppConfig.load())
          df = pd.read_csv("data/raw/loans.csv").drop(
              columns=["default_flag", "disbursal_date", "application_id"]
          ).head(500)
          out = svc.score_batch(df)
          assert out["score"].between(300, 900).all()
          print(out.head())
          PY
